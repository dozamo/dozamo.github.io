<!-- Componente: Render Hook de Hugo
- Mira la URL del enlace.
- Si la URL empieza con http:// o https://, es un enlace externo. Dibuja el enlace con target="_blank".
- Si no, es un enlace interno. Dibuja el enlace de forma normal
-->
{{- $destination := .Destination | safeURL -}}
{{- $isExternal := or (strings.HasPrefix $destination "http://") (strings.HasPrefix $destination "https://") -}}

<a href="{{ $destination }}"{{ if $isExternal }} target="_blank" rel="noopener noreferrer"{{ end }}>
  {{ .Text | safeHTML }}
</a>
