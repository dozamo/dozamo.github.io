baseURL: "https://dozamo.github.io/"
title: "Sitio Movido - Redirecting"

# Deshabilitar casi todo para solo generar el index.html
disableKinds:
  - taxonomy
  - term
  - RSS
  - sitemap
  - section
  - page

# Sin tema necesario para redirección simple
theme: []

# Mínima configuración de Hugo
languageCode: en-us
defaultContentLanguage: en

# Parámetros básicos
params:
  description: "Este sitio se ha movido a dzamo.gitlab.io"
  newURL: "https://dzamo.gitlab.io/"

# Sin necesidad de módulos
module:
  hugoVersion:
    extended: false
    min: 0.110.0
