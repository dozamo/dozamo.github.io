# ./hugo.yaml
baseURL: "https://dozamo.github.io/"
title: mydocs

theme:
  - github.com/google/docsy

# --- Ajustes para URLs ---
canonifyURLs: true      # Reescribe URLs internas usando baseURL
relativeURLs: false     # Queremos rutas absolutas relativas a baseURL

# Language settings
contentDir: content/en
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
# Useful when translating.
enableMissingTranslationPlaceholders: true

# Language configuration
languages:
  en:
    languageName: English
    title: mydocs
    weight: 1
    contentDir: content/en
    params:
      description: My personal notes site
  es:
    languageName: Español
    title: mis docs
    weight: 2
    contentDir: content/es
    params:
      description: Mi sitio de notas personales

enableRobotsTXT: true

# Will give values to .Lastmod etc.
enableGitInfo: true

# Comment out to disable taxonomies in Docsy
disableKinds: [taxonomy]

# You can add your own taxonomies
#taxonomies:
#  tag: tags
#  category: categories

# Highlighting config
pygmentsCodeFences: true
pygmentsUseClasses: false
# Use the new Chroma Go highlighter in Hugo.
pygmentsUseClassic: false
# pygmentsOptions: "linenos=table"
# See https://help.farbox.com/pygments.html
pygmentsStyle: tango

# Configure how URLs look like per section.
permalinks:
  blog: /:section/:year/:month/:day/:slug/

# Image processing configuration.
imaging:
  resampleFilter: CatmullRom
  quality: 75
  anchor: smart

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    # See a complete list of available styles at https://xyproto.github.io/splash/docs/all.html
    style: tango # solarized-dark
    # Uncomment if you want your chosen highlight style used for code blocks without a specified language
    guessSyntax: true

# Parámetros de contenido para búsqueda
frontmatter:
  date: [date, publishDate, lastmod]

# Comment out if you don't want the "print entire section" link enabled.
outputs:
  home: [HTML, RSS, JSON]
  section: [HTML, RSS]

params:
  # Incluir CSS personalizado
  custom_css: ["css/custom.css"]
  # =================== BLOQUE DE PARÁMETROS UNIFICADO ===================
  description: My site personal notes

  # Configuración multiidioma
  language_alternatives:
    - languageName: English
      languageCode: en
    - languageName: Español
      languageCode: es

  taxonomy:
    # set taxonomyCloud = [] to hide taxonomy clouds
    taxonomyCloud: []
    # If used, must have same length as taxonomyCloud
    taxonomyCloudTitle: []
    # set taxonomyPageHeader = [] to hide taxonomies on the page headers
    taxonomyPageHeader: []

  #> privacy_policy: https://policies.google.com/privacy

  # Menu title if your navbar has a versions selector to access old versions of your site.
  # This menu appears only if you have at least one [params.versions] set.
  version_menu: Releases

  # Flag used in the "version-banner" partial to decide whether to display a
  # banner on every page indicating that this is an archived version of the docs.
  # Set this flag to "true" if you want to display the banner.
  archived_version: false

  # The version number for the version of the docs represented in this doc set.
  # Used in the "version-banner" partial to display a version number for the
  # current doc set.
  version: 0.0

  # A link to latest version of the docs. Used in the "version-banner" partial to
  # point people to the main doc site.
  url_latest_version: https://github.com/dozamo/dozamo.github.io/

  # Repository configuration (URLs for in-page links to opening issues and suggesting changes)
  # github_repo: https://github.com/dozamo/mydocs
  # github_project_repo: https://github.com/dozamo/mydocs
  # github_subdir: ""
  # github_branch: main

  # Google Custom Search Engine ID. Remove or comment out to disable search.
  # gcs_engine_id: d72aa9b2712488cc3


  #> # Configuración de búsqueda
  #> search:
  #>   sidebar: true
  #>   placeholder: "Search documentation..."
  #>   max_results: 10

  # Enable syntax highlighting and copy buttons on code blocks with Prism
  prism_syntax_highlighting: false
  
  copyright: "dz | All rights reserved"
  #> copyright:
  #>   authors:

#>  # Copyright multiidioma
#>  copyright_html: >-
#>    <a href="https://github.com/dozamo">dz</a> | Todos los derechos reservados

  # Enable Lunr.js offline search
  offlineSearch: true
  
  # User interface configuration
  ui:    
    #> google_fonts_url: "https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap"
    # Set to true to disable breadcrumb navigation.
    breadcrumb_disable: false
    # Set to false if you don't want to display a logo (/assets/icons/logo.svg) in the top navbar
    navbar_logo: true # oculta el título/logo en la barra superior
    navbar_search_disable: true
    sidebar_search_disable: false   # mantiene deshabilitado el buscador del navbar
    navbar_disable_title: true      # oculta título del sitio en navbar (Docsy respeta esto)
    # Set to true if you don't want the top navbar to be translucent when over a `block/cover`, like on the homepage.
    navbar_translucent_over_cover_disable: false
    # Enable to show the side bar menu in its compact state.
    sidebar_menu_compact: true
    #> sidebar_cache_limit: 10

    feedback:
      enable: false
      # The responses that the user sees after clicking "yes" (the page was helpful) or "no" (the page was not helpful).
      'yes': >-
        Glad to hear it! Please <a href="https://github.com/dozamo/dozamo.github.com/issues/new">tell us how we can improve</a>.
      'no': >-
        Sorry to hear that. Please <a href="https://github.com/dozamo/dozamo.github.com/issues/new">tell us how we can improve</a>.

    # Adds a reading time to the top of each doc.
    # If you want this feature, but occasionally need to remove the Reading time from a single page,
    # add "hide_readingtime: true" to the page's front matter
    readingtime:
      enable: false

  links:
    developer:
      - name: GitHub dozamo
        url: https://github.com/dozamo/
        icon: fab fa-github
        desc: dz

module:
  # Uncomment the next line to build and serve using local docsy clone declared in the named Hugo workspace:
  # workspace: docsy.work
  hugoVersion:
    extended: true
    min: 0.146.0
  imports:
    - path: github.com/google/docsy
      disable: false


# Menú principal
menu:
  main:
    - name: "About"
      url: "/about/"
      weight: 20
      pre: "<i class='fas fa-book'></i>"
    - name: "Blog"
      url: "/blog/"
      weight: 30
      pre: "<i class='fas fa-blog'></i>"
    - name: "LFCS Notes"
      url: "/lfcs/"
      weight: 40
      pre: "<i class='fa-brands fa-linux'></i>"
    - name: "AI Notes"
      url: "/ai-notes/"
      weight: 50
      pre: "<i class='fa-solid fa-brain'></i>"

