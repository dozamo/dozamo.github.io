<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sitio Movido | Redirecting...</title>
    
    <!-- Redirección inmediata -->
    <meta http-equiv="refresh" content="0; url=https://dzamo.gitlab.io/">
    <link rel="canonical" href="https://dzamo.gitlab.io/">
    
    <!-- Para SEO -->
    <meta name="robots" content="noindex, follow">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 500px;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            opacity: 0.9;
        }
        .link {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 5px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .link:hover {
            transform: scale(1.05);
        }
        .spinner {
            margin: 2rem auto;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Sitio Movido</h1>
        <p>Este sitio se ha consolidado en una nueva ubicación.</p>
        <div class="spinner"></div>
        <p>Redirigiendo automáticamente...</p>
        <a href="https://dzamo.gitlab.io/" class="link">
            Ir a dzamo.gitlab.io →
        </a>
    </div>
    
    <!-- JavaScript de respaldo por si la meta refresh falla -->
    <script>
        window.location.href = "https://dzamo.gitlab.io/";
    </script>
</body>
</html>
